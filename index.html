<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>
<body>
    <header class="header">

        <div class="logo">
            To Do List
        </div>
        <nav class="navbar">
           <a href="">Dashboard</a>
           <a href="">Important</a>
           <a href="">Planned</a>
           <a href="">Completed</a>
           <a href="">All</a>
        </nav>
        </header>

        <section class="homepage">

            <section class="intro">
                <h1>How's Your Day Going?</h1>
                <p>What are we working on today?</p>
            </section>

            <div class="task-list" id="tasklist">

            </div>
            <div class="taskdetails" id="taskDetails">
                <h3>Task Details</h3>

                <p class="title"></p>
                <p class="description"></p>
                <p class="due-date"></p>
                <p class="catagory"></p>
            </div>

            <div class="task-input">
                <button class="addbtn" id="addbtn">+</button>
                <input type="text" id="tasktitle" placeholder="Add a task...">
            </div>
        </section>

      <script src="script.js"></script>
</body>

</html>
