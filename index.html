<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>
<body>
    <header class="header">

        <div class="logo">
            To Do List
        </div>
        <nav class="navbar">
           <a href="">Dashboard</a>
           <a href="">Important</a>
           <a href="">Planned</a>
           <a href="">Completed</a>
           <a href="">All</a>
        </nav>
        </header>

        <section class="homepage">
            <div class="content">

            <div class="intro">
                <h1>How's Your Day Going?</h1>
                <p>What are we working on today?</p>
            </section>

            <div class="searchbar">
                <input type="text" id="searchInput" placeholder="Search your tasks...">
            </div>

            <div class="tasks-layout">
                <div class="task-list" id="tasklist">

                    
                </div>
            
                <div class="task-details" id="taskDetails">
                    <div class="head">
                        <h3 class="title"></h3>
                    </div>

                    <div class="details-actions">
                        <div class="action-item">
                            <span>📅 Due date</span>
                            <span class="due-date"></span>
                        </div>

                        <div class="action-item">
                            <span>🏷 Category</span>
                            <span class="category"></span>
                        </div>
                    </div>

                    <div class="details-note">
                        <label>Description</label>
                        <p class="description"></p>
                    </div>

                    <div class="action-btn">
                        <button id="editTaskBtn">✏️ Edit</button>
                        <button id="deleteTaskBtn">❌ Delete</button>

                        <label>
                            Completed:
                            <input type="checkbox" id="completeTaskCheckbox">
                        </label>
                    </div>
                
                </div>
            </div>

            <div class="task-input">
                <button class="addbtn" id="addbtn">+</button>
                <input type="text" id="tasktitle" placeholder="Add a task...">
            </div>
            </div>
        </section>

      <script src="script.js"></script>
</body>

</html>
